# ─────────────────────────────────────────────────────────────────────────────
# CareOne — edge vhost.
#
# This file does NOT belong to the CareOne stack. It is version-controlled here
# but DEPLOYED into the existing edge nginx on the VPS:
#
#   sudo cp deploy/edge/careone-edge.conf /var/www/nammaguide/nginx/conf.d/
#   docker exec nammaguide-nginx nginx -t
#   docker exec nammaguide-nginx nginx -s reload
#
# The edge is `nammaguide-nginx`: the container publishing 0.0.0.0:80 and
# 0.0.0.0:443. It is NOT `c2k-nginx` — that one was demoted to 8081/8443 and is
# itself reached through the edge now. Confirm with:
#
#   docker ps --format 'table {{.Names}}\t{{.Ports}}'
#
# It is a SHARED file location: a syntax error here takes every site on the box
# down — NammaGuide directly and C2K through the 8081 hop — which is why the
# reload is always gated behind `nginx -t` and is a reload, never a restart.
#
# Replace the domain everywhere in one command:
#   sed -i 's/careone\.example\.com/newdomain.com/g' deploy/edge/careone-edge.conf
# then re-issue the certificate for the new names.
# ─────────────────────────────────────────────────────────────────────────────

upstream careone_site {
    # Resolved over the shared docker network. `careone-web` is the network
    # alias set in CareOne's docker-compose.yml — deliberately not `web` or
    # `nginx`, which would collide with the other projects' service names.
    server careone-web:80;
    keepalive 32;
}

# ─── HTTP: ACME challenge + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name careone.example.com www.careone.example.com;

    # Required for Let's Encrypt issuance and renewal. Must stay reachable over
    # plain HTTP — do not redirect this location. The webroot is already bind
    # mounted into the edge container.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: www -> apex ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name www.careone.example.com;

    ssl_certificate     /etc/letsencrypt/live/careone.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careone.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://careone.example.com$request_uri;
}

# ─── HTTPS: the site ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name careone.example.com;

    ssl_certificate     /etc/letsencrypt/live/careone.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careone.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS is set here, at the only place that actually terminates TLS.
    # Note there is no `includeSubDomains` and no `preload`: this VPS serves
    # other projects on other names, and committing them to HTTPS-only from
    # CareOne's vhost would be someone else's outage.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gallery uploads are capped at 5 MB by multer in the API. Must be set here
    # too — the edge sees the request first and would reject it with a bare 413
    # before CareOne's own nginx ever gets a look.
    client_max_body_size 10M;

    # One rule: hand the whole hostname to CareOne's own nginx, which serves
    # the static site and proxies /api itself. The edge stays ignorant of
    # CareOne's internal routing, so changing it never touches this file.
    location / {
        proxy_pass          http://careone_site;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
