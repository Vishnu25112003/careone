user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Don't advertise the exact nginx version in Server: headers
    server_tokens       off;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/rss+xml
                      application/atom+xml image/svg+xml;

    # Gallery uploads are capped at 5 MB by multer
    # (server/src/controllers/gallery.controller.js). 10M leaves headroom for
    # the multipart overhead so the limit is enforced by the app, with a clean
    # error, rather than by nginx with a bare 413.
    client_max_body_size  10M;

    # ── Forwarded-header pass-through ───────────────────────────────────────
    # CareOne sits behind TWO proxies: the VPS edge nginx, then this one.
    # server/src/app.js sets `app.set("trust proxy", 1)`, which trusts exactly
    # one hop and therefore reads the RIGHTMOST X-Forwarded-For entry. If this
    # container appended its own address (the usual $proxy_add_x_forwarded_for),
    # that rightmost entry would be the edge container — every visitor would
    # share one rate-limit bucket and the enquiry form would lock out for
    # everyone after 5 submissions.
    #
    # So this hop is a pass-through, not a trust boundary: forward what the
    # edge already established, and only fall back to local values when the
    # container is reached directly (the 127.0.0.1:8080 debug port).
    # nginx omits a proxy_set_header whose value is empty, so an absent
    # X-Forwarded-For stays absent rather than becoming a blank header.
    map $http_x_forwarded_proto $careone_fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_x_real_ip $careone_real_ip {
        default $http_x_real_ip;
        ''      $remote_addr;
    }

    include /etc/nginx/conf.d/*.conf;
}
