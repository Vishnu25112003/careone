# ─────────────────────────────────────────────────────────────────────────────
# CareOne — internal nginx.
#
# This server is NOT internet-facing. It listens on plain HTTP inside the
# careone stack; the shared edge proxy on the VPS terminates SSL and forwards
# here (see deploy/edge/careone-edge.conf). That is why there is no listen 443,
# no certificate, and no ACME challenge location in this file.
#
# It does two jobs:
#   1. serve the compiled React SPA baked into the image at /var/www/site
#   2. reverse-proxy /api/ to the CareOne API container
# ─────────────────────────────────────────────────────────────────────────────

upstream careone_api {
    server careone-api:5000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/site;
    index index.html;

    include /etc/nginx/conf.d/security.inc;

    # ── API reverse proxy ───────────────────────────────────────────────────
    # The X-Forwarded-* values are PASSED THROUGH from the edge rather than
    # appended to — see the `map` blocks and the long comment in nginx.conf.
    # express-rate-limit keys on these for the real client IP on
    # POST /api/requests and POST /api/callbacks.
    location /api/ {
        proxy_pass          http://careone_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $careone_real_ip;
        proxy_set_header    X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $careone_fwd_proto;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # Health probe — same path, just without filling the access log.
    location = /api/health {
        access_log off;
        proxy_pass          http://careone_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-Proto $careone_fwd_proto;
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Never cache index.html: it references content-hashed asset filenames, so
    # a stale copy 404s on the CSS/JS it points at.
    location = /index.html {
        include /etc/nginx/conf.d/security.inc;  # re-include: nginx drops parent add_header here
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        expires 0;
    }

    # Vite content-hashes these filenames, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security.inc;  # re-include: nginx drops parent add_header here
        expires    1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Replaces the Vercel rewrite that used to do this. Required for every
    # client-side route in client/src/App.jsx — /about, /services, /gallery,
    # /contact, /admin/login, /admin/dashboard — to survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
