<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;overflow:hidden;background:#F2F8FA;min-height:320px;font-family:'Nunito Sans',sans-serif;">
  <div style="position:absolute;top:-260px;right:-160px;width:640px;height:640px;border-radius:50%;background:linear-gradient(200deg,#BFE3E2,#7FC9C7);"></div>
  <div style="position:absolute;top:-290px;right:-130px;width:600px;height:600px;border-radius:50%;background:linear-gradient(200deg,#2AA7A5,#0E7C7B);"></div>
  <div style="position:absolute;top:-320px;right:-100px;width:560px;height:560px;border-radius:50%;overflow:hidden;box-shadow:-14px 20px 40px rgba(20,53,92,.18);">
    <image-slot id="{{ slotId }}" shape="rect" placeholder="Drop a banner photo"></image-slot>
  </div>
  <div style="max-width:1170px;margin:0 auto;padding:96px 24px 64px;position:relative;">
    <h1 style="margin:0 0 10px;font-family:Poppins,sans-serif;font-weight:600;font-size:clamp(30px,4.5vw,46px);color:#14355C;">{{ title }}</h1>
    <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;">
      <span onClick="{{ onHome }}" style="cursor:pointer;color:#8A97AC;" style-hover="color:#0E7C7B;">Home</span>
      <span style="color:#B9C4D6;">/</span>
      <span style="color:#0E7C7B;font-weight:700;">{{ crumb }}</span>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1170,&quot;height&quot;:320},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;banner-slot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onHome&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
